<!-- Drari : page de chargement du projet Aura.
     Le site complet pèse environ 1,4 Mo (v0.5), alors qu'Aura garde au plus 1 Mo de HTML.
     Cette page va donc chercher le site dans le dépôt GitHub cedricoXII/drari-site, à la version VERSION
     (le numéro d'un commit), puis l'affiche à sa place.
     Pour mettre en ligne une nouvelle version : mettre le numéro du nouveau commit dans VERSION.
     Ne pas modifier avec le chat d'Aura : il ne voit que cette petite page, pas le site.
     v0.5 : les balises de partage sont ici aussi (WhatsApp et Facebook ne lisent que cette page), et le texte du haut de page
     s'affiche pendant le chargement du site (il est remplacé par le site dès qu'il arrive). -->
<style>
html,body{margin:0;min-height:100%;background:#0A1019;}
html.fl-dive,html.fl-dive body{background:radial-gradient(120% 120% at 46% 42%,#E2563F 0%,#CF3E2D 45%,#A72C21 100%);}
.dr-msg{position:fixed;inset:0;display:grid;place-items:center;margin:0;padding:24px;text-align:center;color:#E9EEF2;font:15px/1.5 system-ui,sans-serif;}
.dr-wait{position:fixed;left:clamp(16px,3.2vw,48px);right:clamp(16px,3.2vw,48px);top:clamp(96px,15vh,150px);max-width:640px;color:#E9EEF2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
.dr-wait p{margin:0;}
.dr-wait .k{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(233,238,242,.84);}
.dr-wait .t{margin:14px 0 0;font-size:clamp(2.25rem,1.75rem + 2.5vw,3.5rem);line-height:1.08;letter-spacing:-.02em;font-weight:500;}
.dr-wait .t span{display:block;color:#E5483B;}
.dr-wait .l{margin:18px 0 0;max-width:36ch;font-size:clamp(1rem,.9rem + .5vw,1.125rem);line-height:1.5;color:rgba(233,238,242,.9);}
.dr-wait .b{margin:28px 0 0;font-size:14px;color:rgba(233,238,242,.7);}
</style>
<script>if(/[?&]dive=1(&|$)/.test(location.search))document.documentElement.classList.add('fl-dive');</script>
</head>
<body>
<div class="dr-wait" aria-busy="true"><p class="k">Drari · Transporteurs Europe – Maghreb</p><h1 class="t">Ta date est prête. <span>Ton camion, pas encore.</span></h1><p class="l">Mets ton trajet sur Drari&nbsp;: ta route, tes dates et ton prix au même endroit, là où les familles chercheront.</p><p class="b">Chargement de la page…</p></div>
<script>
(function(){
  var REPO = 'cedricoXII/drari-site', VERSION = '1f9de779c812c2fcb16d4dee1e51052d6d0b6764'; // v0.5
  var BASES = [
    'https://cdn.jsdelivr.net/gh/' + REPO + '@' + VERSION + '/',
    'https://raw.githubusercontent.com/' + REPO + '/' + VERSION + '/'
  ];
  function show(i){
    if(i >= BASES.length){
      document.documentElement.className = '';
      document.body.innerHTML = '<p class="dr-msg">Le site n’a pas pu se charger. Vérifie la connexion et recharge la page.</p>';
      return;
    }
    fetch(BASES[i] + 'index.html')
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
      .then(function(h){
        if(h.indexOf('data-hero="fold"') < 0) throw new Error('page inattendue');
        h = h.split('__DRARI_BASE__').join(BASES[i]).split('__DRARI_RAW__').join(BASES[1]);
        document.open(); document.write(h); document.close();
      })
      .catch(function(){ show(i + 1); });
  }
  show(0);
})();
</script>
<noscript><p class="dr-msg">Ce site a besoin de JavaScript.</p></noscript>
</body>
</html>
